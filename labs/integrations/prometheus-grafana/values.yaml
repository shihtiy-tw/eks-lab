# Custom values for Prometheus
prometheus:
  server:
    retention: 7d  # Data retention period
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    persistentVolume:
      size: 10Gi
      storageClass: gp2
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
  alertmanager:
    persistentVolume:
      size: 2Gi
      storageClass: gp2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Custom values for Grafana
grafana:
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: LoadBalancer
  adminPassword: admin  # Change this in production
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kubernetes-cluster-monitoring:
        gnetId: 10000  # Grafana dashboard ID for Kubernetes cluster monitoring
        datasource: Prometheus
      node-exporter:
        gnetId: 1860   # Node Exporter dashboard
        datasource: Prometheus
      pod-monitoring:
        gnetId: 6417   # Kubernetes Pod monitoring dashboard
        datasource: Prometheus
