---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-clb-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-clb
  template:
    metadata:
      labels:
        app: nginx-clb
    spec:
      containers:
        - name: nginx-clb
          image: nginx
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
